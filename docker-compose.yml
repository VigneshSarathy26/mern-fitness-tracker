version: '3.8'

services:
  # --- Reverse Proxy & Edge ---
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api-gateway
    networks:
      - fitness-network

  # --- API Gateway ---
  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - AUTH_SERVICE_URL=http://auth-service:5001
      - USER_SERVICE_URL=http://user-service:5002
      - WORKOUT_SERVICE_URL=http://workout-service:5003
      - NUTRITION_SERVICE_URL=http://nutrition-service:5004
      - ANALYTICS_SERVICE_URL=http://analytics-service:5005
      - GOAL_SERVICE_URL=http://goal-service:5007
    depends_on:
      - auth-service
      - user-service
      - workout-service
      - nutrition-service
      - analytics-service
      - goal-service
    networks:
      - fitness-network

  # --- Frontend React App ---
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost/api
    networks:
      - fitness-network

  # --- Core Microservices ---
  auth-service:
    build: ./services/auth-service
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/auth_db
      - JWT_SECRET=${JWT_SECRET:-elite_fitness_secret_2026}
    depends_on:
      - mongodb
    networks:
      - fitness-network

  user-service:
    build: ./services/user-service
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://mongodb:27017/user_db
    depends_on:
      - mongodb
    networks:
      - fitness-network

  workout-service:
    build: ./services/workout-service
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongodb:27017/workout_db
    depends_on:
      - mongodb
    networks:
      - fitness-network

  nutrition-service:
    build: ./services/nutrition-service
    environment:
      - PORT=5004
      - MONGO_URI=mongodb://mongodb:27017/nutrition_db
    depends_on:
      - mongodb
    networks:
      - fitness-network

  analytics-service:
    build: ./services/analytics-service
    environment:
      - PORT=5005
      - MONGO_URI=mongodb://mongodb:27017/analytics_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongodb
      - redis
    networks:
      - fitness-network

  goal-service:
    build: ./services/goal-service
    environment:
      - PORT=5007
      - MONGO_URI=mongodb://mongodb:27017/goal_db
    depends_on:
      - mongodb
    networks:
      - fitness-network

  notification-service:
    build: ./services/notification-service
    environment:
      - PORT=5006
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - fitness-network

  # --- Infrastructure ---
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - fitness-network

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    networks:
      - fitness-network

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - CLUSTER_ID=Mk3OEYBSD34fcwNTJENDM2Qk
    networks:
      - fitness-network

networks:
  fitness-network:
    driver: bridge

volumes:
  mongo_data:
